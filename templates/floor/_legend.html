<div id="phase-legend"
     class="phase-legend"
     hx-get="{% url 'floor_legend' %}{% if phase_filter %}?phase={{ phase_filter }}{% endif %}"
     hx-trigger="floor-refresh from:body"
     hx-swap="outerHTML">
  {% for key, label, count in phase_legend %}
  <a class="leg phase-{{ key }}" href="?phase={{ key }}"><i></i>{{ label }} {{ count }}</a>
  {% endfor %}
  {% if phase_filter %}
  <a class="leg" href="{% url 'home' %}">清除筛选</a>
  {% endif %}
</div>
